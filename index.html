            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            box-sizing: border-box;
        }

            background-color: var(--container-bg);

            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(255, 143, 163, 0.15);
            width: 100%;
            max-width: 500px;
            padding: 15px 12px;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .logo-text {
            display: inline-block;
            font-weight: 900;
        }
        .logo-gaku { color: var(--logo-gaku); }
        .logo-shu { color: var(--logo-shu); }
        .logo-ku { color: var(--logo-ku); }
        .logo-kan { color: var(--logo-kan); }

        h1 {
            color: var(--dark-pink);

            margin-bottom: 12px;

            font-size: 16px;
            font-weight: bold;

            margin: 8px 4px;

        }

        .btn:hover {
            background-color: var(--dark-pink);

        }

        .btn-gold {
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: #4a2f00;
            box-shadow: 0 4px 15px rgba(255, 165, 0, 0.4);
            border: 2px solid #fff;
        }

        .hidden { display: none !important; }

        .chart-container {
            position: relative;
            width: 100%;

            aspect-ratio: 4 / 2.9; 
            border: 2px solid var(--primary-pink);
            border-radius: 12px;
            padding: 6px;
            background-color: #fff;
            box-sizing: border-box;

            font-size: 16px;

</head>

        function shuffleArray(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }

        function playCorrectSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = (freq, time) => {
                    let o = audioCtx.createOscillator(), g = audioCtx.createGain();
                    o.type = 'triangle'; o.frequency.setValueAtTime(freq, audioCtx.currentTime + time);
                    g.gain.setValueAtTime(0.15, audioCtx.currentTime + time); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + time + 0.15);
                    o.connect(g); g.connect(audioCtx.destination); o.start(audioCtx.currentTime + time); o.stop(audioCtx.currentTime + time + 0.15);
                };
                osc(523.25, 0); osc(659.25, 0.08); osc(783.99, 0.16);
            } catch (e) {}
        }

        const drawArrow = (ctx, fromX, fromY, toX, toY, color) => {
            const headlen = 8; 
            const dx = toX - fromX;
            const dy = toY - fromY;
            const angle = Math.atan2(dy, dx);
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.8;
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            ctx.beginPath();
            ctx.fillStyle = color;
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
        };

        const customAnnotationPlugin = {
            id: 'customAnnotation',
            afterDraw: (chart) => {
                const opts = chart.options.plugins.customAnnotation;
                if (!opts || !opts.enabled) return;

                const ctx = chart.ctx;
                const xAxis = chart.scales.x;
                const yTemp = chart.scales['y-temp'];
                const yPrecip = chart.scales['y-precip'];
                const climateType = opts.type;
                const textX = chart.width - 100; 

                ctx.save();
                ctx.font = 'bold 11px sans-serif';
                ctx.textBaseline = 'middle';

                const drawLabelText = (text, x, y, bgCol, textCol) => {
                    ctx.fillStyle = bgCol;
                    ctx.beginPath();
                    ctx.roundRect(x - 5, y - 9, 102, 18, 4);
                    ctx.fill();
                    ctx.fillStyle = textCol;
                    ctx.fillText(text, x, y);
                };

                if (climateType === "中央高地の気候" || climateType === "瀬戸内の気候") {

                    drawLabelText("150mmで少ない！", textX, y150 - 15, '#e0f2fe', '#0284c7');
                }

                if (climateType === "中央高地の気候") {
                    const xJan = xAxis.getPixelForValue(0);
                    const yVal = yTemp.getPixelForValue(chart.data.datasets[1].data[0]);

                    ctx.beginPath();
                    ctx.arc(xJan, yVal, 16, 0, 2 * Math.PI);
                    ctx.strokeStyle = '#ff4d6d';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    const lblY = (40 > yVal - 20) ? yVal + 35 : yVal - 30;
                    drawLabelText("１月だけ０℃以下！", textX, lblY, '#ffe4e6', '#9f1239');
                    drawArrow(ctx, textX - 8, lblY, xJan + 12, yVal - 8, '#ff4d6d');
                } 
                else if (climateType === "瀬戸内の気候") {
                    const xJan = xAxis.getPixelForValue(0);
                    const yVal = yTemp.getPixelForValue(chart.data.datasets[1].data[0]);

                    ctx.beginPath();
                    ctx.arc(xJan, yVal, 16, 0, 2 * Math.PI);
                    ctx.strokeStyle = '#ff4d6d';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    const lblY = yVal + 35; 
                    drawLabelText("冬も暖かい(5℃以上)", textX, lblY, '#ffe4e6', '#9f1239');
                    drawArrow(ctx, textX - 8, lblY, xJan + 12, yVal + 6, '#ff4d6d');
                }
                else if (climateType === "北海道の気候") {
                    const y0 = yTemp.getPixelForValue(0);
                    ctx.beginPath();
                    ctx.strokeStyle = '#3b82f6';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 4]);
                    ctx.moveTo(xAxis.left, y0);
                    ctx.lineTo(xAxis.right, y0);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    drawLabelText("気温０℃のライン", textX, y0 - 15, '#dbeafe', '#1e40af'); 

                    const targetIndices = [11, 0, 1];
                    ctx.strokeStyle = '#ff4d6d';
                    ctx.lineWidth = 2.5;
                    targetIndices.forEach(idx => {
                        const x = xAxis.getPixelForValue(idx);
                        const y = yTemp.getPixelForValue(chart.data.datasets[1].data[idx]);
                        ctx.beginPath();
                        ctx.arc(x, y, 14, 0, 2 * Math.PI);
                        ctx.stroke();
                    });

                    const xJan = xAxis.getPixelForValue(0);
                    const yJan = yTemp.getPixelForValue(chart.data.datasets[1].data[0]);
                    const lblY = yJan + 30; 
                    drawLabelText("冬に０℃以下になる", textX, lblY, '#ffe4e6', '#9f1239');
                    drawArrow(ctx, textX - 8, lblY, xJan + 12, yJan + 10, '#ff4d6d');
                }
                else if (climateType === "日本海側の気候") {
                    const xDec = xAxis.getPixelForValue(11);
                    const xJan = xAxis.getPixelForValue(0);
                    const yDec = yPrecip.getPixelForValue(chart.data.datasets[0].data[11]);
                    const yJan = yPrecip.getPixelForValue(chart.data.datasets[0].data[0]);
                    const yBase = yPrecip.getPixelForValue(0);

                    ctx.strokeStyle = '#ff4d6d';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(xDec - 12, yDec - 6, 24, yBase - yDec + 12);
                    ctx.strokeRect(xJan - 12, yJan - 6, 24, yBase - yJan + 12);

                    const lblY = yJan - 30;
                    drawLabelText("冬に雨や雪が多い！", textX, lblY, '#ffe4e6', '#9f1239');
                    drawArrow(ctx, textX - 8, lblY, xJan + 14, yJan + 5, '#ff4d6d');
                }
                else if (climateType === "太平洋側の気候") {
                    const xDec = xAxis.getPixelForValue(11);
                    const xJan = xAxis.getPixelForValue(0);
                    const yDec = yPrecip.getPixelForValue(chart.data.datasets[0].data[11]);
                    const yJan = yPrecip.getPixelForValue(chart.data.datasets[0].data[0]);
                    const yBase = yPrecip.getPixelForValue(0);

                    ctx.strokeStyle = '#3b82f6';
                    ctx.lineWidth = 3.5;
                    ctx.strokeRect(xDec - 12, yDec - 4, 24, yBase - yDec + 8);
                    ctx.strokeRect(xJan - 12, yJan - 4, 24, yBase - yJan + 8);
                    
                    const lblY1 = yJan - 35; 
                    drawLabelText("冬に雨が少ない！", textX, lblY1, '#dbeafe', '#1e40af');
                    drawArrow(ctx, textX - 8, lblY1, xJan + 14, yJan + 4, '#3b82f6');

                    const xJul = xAxis.getPixelForValue(6);
                    const yJul = yPrecip.getPixelForValue(chart.data.datasets[0].data[6]);

                    ctx.beginPath();
                    ctx.arc(xJul, yJul, 18, 0, 2 * Math.PI);
                    ctx.strokeStyle = '#ff4d6d';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();

                    const lblY2 = yJul + 25; 
                    drawLabelText("夏に雨が多い！", textX, lblY2, '#ffe4e6', '#9f1239');
                    drawArrow(ctx, textX - 8, lblY2, xJul + 14, yJul + 10, '#ff4d6d');
                }
                else if (climateType === "南西諸島の気候") {
                    const y15Real = yTemp.getPixelForValue(15);
                    ctx.beginPath();
                    ctx.strokeStyle = '#ff4d6d';
                    ctx.lineWidth = 2.5;
                    ctx.setLineDash([5, 4]);
                    ctx.moveTo(xAxis.left, y15Real);
                    ctx.lineTo(xAxis.right, y15Real);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    drawLabelText("基準の１５℃ライン", textX, y15Real + 15, '#ffe4e6', '#9f1239'); 

                    const xJan = xAxis.getPixelForValue(0);
                    const yJan = yTemp.getPixelForValue(chart.data.datasets[1].data[0]);
                    const lblY = yJan - 30; 
                    drawLabelText("冬でも１５℃以上！", textX, lblY, '#fffbeb', '#9a3412');
                    drawArrow(ctx, textX - 8, lblY, xJan + 12, yJan - 5, '#ff4d6d');
                }

                ctx.restore();
            }
        };

        function startQuiz(stageNum) {
            if (autoTransitionTimer) clearTimeout(autoTransitionTimer);
            currentStage = stageNum;
            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.add("hidden");
            document.getElementById("quiz-screen").classList.remove("hidden");
            
            document.getElementById("options-container").classList.remove("hidden");
            document.getElementById("explanation-area").classList.add("hidden");

            const baseData = (currentStage === 2) ? quizData2 : quizData1;
            quizQueue = JSON.parse(JSON.stringify(baseData));
            shuffleArray(quizQueue);
            
            currentQuestionIndex = 0; mistakeCount = 0; isFirstTimeSuccess = true;
            loadQuestion();
        }

        function loadQuestion() {
            document.getElementById("options-container").classList.remove("hidden");
            document.getElementById("explanation-area").classList.add("hidden");
            
            const heading = document.getElementById("question-heading");
            const stageText = currentStage === 2 ? "2nd ステージ" : "1st ステージ";
            heading.innerText = `${stageText}　第 ${currentQuestionIndex + 1} 問`;
            heading.classList.remove("hidden");

            const data = quizQueue[currentQuestionIndex];
            
            const avg = (data.temps.reduce((s, t) => s + t, 0) / 12).toFixed(1);
            document.getElementById("average-temp").innerText = `年間の平均気温： ${avg} ℃`;
            
            const container = document.getElementById("options-container");
            container.innerHTML = "";
            climateOptions.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn"; btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt);
                container.appendChild(btn);
            });

            const ctx = document.getElementById('uonzuChart').getContext('2d');
            if (myChart) myChart.destroy();
            
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: verticalMonths, 
                    datasets: [
                        { label: '降水量', data: data.precips, backgroundColor: 'rgba(89, 165, 216, 0.8)', borderColor: 'rgba(43, 108, 176, 1)', borderWidth: 1, yAxisID: 'y-precip', 
                          barPercentage: 1.0, categoryPercentage: 1.0, order: 2 }, 
                        { label: '気温', data: data.temps, type: 'line', borderColor: '#ff4d6d', backgroundColor: '#ff4d6d', borderWidth: 3, pointRadius: 4, yAxisID: 'y-temp', order: 1 }
                    ]
                },
                options: {
                    animation: false, responsive: true, maintainAspectRatio: false,
                    layout: {
                        padding: {
                            right: 110, 
                            top: 10,
                            left: 5,
                            bottom: 5
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                font: {
                                    size: 10,
                                    weight: 'bold'
                                },
                                maxRotation: 0, 
                                minRotation: 0
                            }
                        },
                        'y-temp': { type: 'linear', position: 'left', min: -10, max: 35, ticks: { stepSize: 5 } },
                        'y-precip': { type: 'linear', position: 'right', min: 0, max: 400, grid: { drawOnChartArea: false }, ticks: { stepSize: 50 } }
                    },
                    plugins: {
                        legend: { display: false }, 
                        customAnnotation: {
                            enabled: false,
                            type: ''
                        }
                    }
                },
                plugins: [customAnnotationPlugin]
            });
        }

        function checkAnswer(opt) {
            const data = quizQueue[currentQuestionIndex];
            const correct = (opt === data.climate);

            myChart.options.plugins.customAnnotation = {
                enabled: true,
                type: data.climate
            };
            myChart.update();

            document.getElementById("question-heading").classList.add("hidden");

            document.getElementById("options-container").classList.add("hidden");
            document.getElementById("explanation-area").classList.remove("hidden");

            const judge = document.getElementById("result-judge");
            
            const pointContainer = document.getElementById("main-point-container");
            pointContainer.innerHTML = `
                <p id="responsive-point-text" class="point-flow">${data.featureText}</p>
                <p class="point-conclusion">${data.conclusionText}</p>
                <p class="point-location">${data.location}<span class="point-pref">（${data.pref}）</span></p>
            `;
            
            // 【新機能】文字のはみ出しを検知してフォントサイズを自動縮小するフィッティング処理
            // 描画が完了した直後に計算を行うため、setTimeout(0)を使用
            setTimeout(() => {
                const el = document.getElementById("responsive-point-text");
                const box = el.parentElement; // 点線で囲まれた親要素(.main-point-box)
                if (el && box) {
                    // 親要素の内側の最大許容幅を算出 (左右のpadding分24pxを差し引く)
                    const maxWidth = box.clientWidth - 24; 
                    let currentFontSize = 22; // 初期フォントサイズ (22px)
                    
                    // 文字の実際の横幅が親要素の許容幅を超えている間、ループでフォントを1pxずつ小さくする
                    // 最低サイズは12pxまで
                    while (el.scrollWidth > maxWidth && currentFontSize > 12) {
                        currentFontSize--;
                        el.style.fontSize = currentFontSize + "px";
                    }
                }
            }, 0);

            document.getElementById("explanation-text").innerText = data.explanation;
            
            const nextBtn = document.getElementById("next-btn");
            const confBtn = document.getElementById("confirm-btn");
            nextBtn.innerText = currentQuestionIndex === quizQueue.length - 1 ? "最終結果を見る" : "次へ進む";

            if (correct) {
                playCorrectSound(); 
                judge.innerText = "⭕ 正解！"; 
                judge.className = "result-box correct";
                confBtn.classList.add("hidden"); 
                nextBtn.classList.add("hidden");
                autoTransitionTimer = setTimeout(nextQuestion, 1000);
            } else {
                judge.innerText = "❌ まちがい..."; 
                judge.className = "result-box incorrect";
                isFirstTimeSuccess = false; mistakeCount++;
                
                const rem = quizQueue.slice(currentQuestionIndex + 1);
                rem.push(JSON.parse(JSON.stringify(data)), JSON.parse(JSON.stringify(data)));
                shuffleArray(rem);
                quizQueue = quizQueue.slice(0, currentQuestionIndex + 1).concat(rem);
                
                confBtn.classList.remove("hidden"); 
                nextBtn.classList.add("hidden");
            }
        }

        function confirmExplanation() { 
            document.getElementById("confirm-btn").classList.add("hidden"); 
            document.getElementById("next-btn").classList.remove("hidden"); 
        }

        function nextQuestion() {
            currentQuestionIndex++; 
            if (quizQueue.length > currentQuestionIndex) { 
                loadQuestion(); 
            } else {
                showFinalResult();
            }
        }

        function launchConfetti(isGrand) {
            const count = isGrand ? 350 : 120;
            const emojis = ['👑', '✨', '🎉', '💮', '🎖️', '⭐', '🎈'];
            for (let i = 0; i < count; i++) {
                const c = document.createElement('div'); c.className = 'confetti';
                if (isGrand && 0.25 > Math.random()) { 
                    c.innerText = emojis[Math.floor(Math.random() * emojis.length)]; 
                    c.style.fontSize = '24px'; 
                } else { 
                    c.style.backgroundColor = ['#ff8fa3', '#ffd166', '#4cc9f0', '#10b981', '#ff9f43'][Math.floor(Math.random() * 5)]; 
                    c.style.width = '10px'; c.style.height = '12px'; 
                }
                c.style.left = Math.random() * 100 + 'vw'; c.style.top = '-40px';
                const d = Math.random() * 3 + 2;
                c.style.animation = `fall ${d}s linear ${Math.random() * 2}s forwards, sway 2s ease-in-out infinite alternate`;
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 5000);
            }
        }

        function showFinalResult() {
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            
            const tit = document.getElementById("result-title"), com = document.getElementById("final-comment"), act = document.getElementById("result-actions"), gran = document.getElementById("grand-celebration-zone");
            act.innerHTML = ""; gran.innerHTML = "";

            if (currentStage === 1) {
                if (isFirstTimeSuccess) {
                    tit.innerText = "ファーストステージ クリア！";
                    com.innerHTML = `⭐ ノーミス全問正解！ ⭐<br><span style="color:var(--dark-pink); font-size:24px;">パーフェクト！素晴らしい！🎉</span><br>特別な難関<strong>セカンドステージ</strong>への扉が開いたよ！`;
                    launchConfetti(false);
                    const b = document.createElement("button"); b.className = "btn btn-gold"; b.innerText = "👑 セカンドステージに挑戦！"; b.onclick = () => startQuiz(2); act.appendChild(b);
                } else {
                    tit.innerText = "ファーストステージ クリア！"; 
                    com.innerHTML = `全問クリアおめでとう！👍<br>ノーミス全問正解を達成すると、セカンドステージへ進めるよ。`;
                    const b = document.createElement("button"); b.className = "btn"; b.innerText = "もう一度挑戦してノーミスを狙う"; b.onclick = () => startQuiz(1); act.appendChild(b);
                }
            } else {
                if (isFirstTimeSuccess) {
                    tit.innerText = "完全制覇！！！"; 
                    gran.innerHTML = `<span class="grand-title">👑 超ウルトラグランドスラム達成 👑</span>`;
                    com.innerHTML = `<span style="color:#ff9f43; font-size:22px; font-weight:900;">神レベル！おめでとう！💮</span><br>全ステージを一問も間違えずにノーミスクリア！君は完全無欠の雨温図マスターだ！`;
                    launchConfetti(true);
                } else {
                    tit.innerText = "セカンドステージ クリア！"; 
                    com.innerHTML = `おめでとう！非常に難しいセカンドステージを、最後までリベンジし続けて合格したね！💪`;
                }
                const b = document.createElement("button"); b.className = "btn"; b.innerText = "最初の画面に戻る"; b.onclick = () => resetQuiz(); act.appendChild(b);
            }
        }

        function resetQuiz() { 
            document.getElementById("result-screen").classList.add("hidden"); 
            document.getElementById("start-screen").classList.remove("hidden"); 
        }
    </script>
</body>
</html>
